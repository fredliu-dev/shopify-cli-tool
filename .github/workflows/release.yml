name: Release Desktop

# 推一个 desktop-v* 的 tag 即触发：mac 先构建并创建 Release、上传 mac 产物；win 随后（needs mac）
# 把 win 产物「追加」进同一个 Release。两个平台产物落在一个版本里。
#
# 为何串行而非 matrix 并行：electron-builder --publish always 会对 v<version> tag「找不到则创建、
# 找到则追加」Release。并行时 mac/win 两个 job 同时对同一 tag 创建/编辑 Release 会互相覆盖，
# 表现为「同版本出现两个 Release」或「后发的把先发的产物冲掉」（实测 v0.1.16 产物在 win-only /
# mac-only 间来回翻）。串行后 mac 先建 Release，win 再追加，彼此不冲突。
# 与 CLI 的 npm 发布（scripts/publish.js）完全解耦。
on:
  push:
    tags:
      - 'desktop-v*'

# electron-builder 要用 GITHUB_TOKEN 创建 Release 并上传产物，必须显式授 contents: write。
# 否则报 403 "Resource not accessible by integration"（默认 token 权限不含写）。
permissions:
  contents: write

jobs:
  # ① mac：先跑，创建 v<version> Release 并上传 mac 产物（dmg/zip + latest-mac.yml + blockmap）
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # 不指定 version：pnpm/action-setup@v4 会自动读 package.json 的 packageManager（pnpm@11.20.0），
      # 避免与 packageManager 双来源冲突（曾报 "Multiple versions of pnpm specified"）。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer/main/preload
        run: pnpm -F @shopify-cli-tool/desktop build

      - name: Package & publish to GitHub Release (mac)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -F @shopify-cli-tool/desktop exec electron-builder -- --publish always

  # ② win：等 mac 建好 Release 后再跑，把 win 产物（exe + latest.yml + blockmap）追加进同一 Release
  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer/main/preload
        run: pnpm -F @shopify-cli-tool/desktop build

      - name: Package & publish to GitHub Release (win)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -F @shopify-cli-tool/desktop exec electron-builder -- --publish always
