name: Release Desktop

# 推一个 desktop-v* 的 tag 即触发：在 mac/windows 各构建并发布到 GitHub Release。
# 与 CLI 的 npm 发布（scripts/publish.js）完全解耦。
on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # 不指定 version：pnpm/action-setup@v4 会自动读 package.json 的 packageManager（pnpm@11.20.0），
      # 避免与 packageManager 双来源冲突（曾报 "Multiple versions of pnpm specified"）。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer/main/preload
        run: pnpm -F @shopify-cli-tool/desktop build

      - name: Package & publish to GitHub Release
        env:
          # electron-builder 用此 token 上传产物到 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -F @shopify-cli-tool/desktop exec electron-builder -- --publish always
