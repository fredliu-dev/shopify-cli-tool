appId: dev.fredliu.shopify-desktop
productName: Shopify Toolbox

# 不打 asar：runner.js 用 spawn 出去的「系统 node」跑 @shopify/cli 的 bin/run.js，
# 而系统 node 无法读取 app.asar 归档（报 MODULE_NOT_FOUND）。
# 关掉 asar 让 node_modules 以真实目录存在，require.resolve 拿到的就是可直接访问的路径。
# （内部工具，不签名/公证，asar 的隐藏/启动加速收益可忽略。）
asar: false

# 产物输出目录
directories:
  output: release

# 打包内容：electron-vite 产物 + package.json（dependencies 如
# @shopify-cli-tool/core 会被 electron-builder 自动打进包内）
files:
  - out/**/*
  - package.json
  - '!**/README.md'
  - '!**/.git/**'

mac:
  target:
    - target: dmg
      arch:
        - arm64 # Apple Silicon；CI 上可加 x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # 暂不签名/公证（个人/内部使用）：用户首次打开需右键 → 打开
  # identity: null

win:
  icon: build/icon.ico
  target:
    - target: nsis # 出 .exe 安装包
      arch:
        - x64

# 发布到 GitHub Release：客户端不再自动更新，用户从 Release 页面手动下载安装
publish:
  provider: github
  owner: fredliu-dev
  repo: shopify-cli-tool
